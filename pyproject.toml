[project]
name = "glassflow"
version = "0.1.0"
description = "GlassFlow development foundation for the KSM case"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "hypothesis>=6,<7"]
cutting = ["numpy>=2,<3", "scipy>=1.15,<2", "ortools>=9.12,<10", "networkx>=3.4,<4"]
intelligence = ["google-genai>=1,<3"]
platform = ["alembic>=1.15,<2", "scikit-learn>=1.6,<2", "reportlab>=4,<5", "pypdf>=5,<7", "pyinstaller>=6,<7", "pandas>=2,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/glassflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["backend"]
exclude = ["analysis", "inputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
